<html>
<head>
  <title>Rectangle Area Calculator</title>
</head>
<body>
    <div>
        <h1>Rectangle Area Calculator</h1>
        <label for="length">Enter the length: </label>
        <input type="number" id="length"><br><br>

        <label for="width">Enter the width: </label>
        <input type="number" id="width"><br><br>

        <button onclick="calculateArea()">Calculate Area</button><br><br>

        <p id="result"></p>
        <script src="./calculate_Area.js"></script>
    </div>
    <div>
        <h1>Grocerie tracking</h1>
        <label for="Grocerie1">Enter amount for Grocerie 1</label>
        <input type="number" id="Grocerie1"><br><br>

        <label for="Grocerie2">Enter amount for Grocerie 2</label>
        <input type="number" id="Grocerie2"><br><br>

        <label for="Grocerie3">Enter amount for Grocerie 3</label>
        <input type="number" id="Grocerie3"><br><br>

        <button onclick="calculateGrocerie()">Calculate Groceries</button><br><br>

        <p id="resultGrocerie"></p>
        <script src="./calculate_Area.js"></script>

    </div>
</body>
</html>
